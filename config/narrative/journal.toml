      "J'ai avancé de {distance_m:0} m et noté {couples_sol} essais de mes roues."]
en = ["I kept {couples_sol} wheel trials in memory and moved {distance_m:0} m.",
      "I moved {distance_m:0} m and noted {couples_sol} wheel trials."]

