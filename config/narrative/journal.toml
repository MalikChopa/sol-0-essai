# Journal templates (SPEC 8.1, 8.3). One [[line]] per template id.
#   slot    : "summary" (first matching line of the stage), "learn" (idem), "extra" (all matching, by prio, at most 3)
#   stage   : stages where a summary/learn line applies (absent = any; stages above 5 use the stage-5 tone)
#   when    : conditions on facts, all must hold. "k" truthy, "!k" falsy or None, "k>N" "k>=N" "k<N" "k<=N" "k==N",
#             "k=text" (string equality), "k:text" (text in the list k). A comparison with None is false.
#   needs   : facts that must not be None; every marker of the text must be in needs or be a derived marker (see journal.py)
#   prio    : extras, smaller first. replaces : ids of lines this one supersedes when it matches.
#   fr, en  : same number of variants; variant = u64(derive(seed, "journal", sol, crc32(id))) mod len.
# Markers: {name} or {name:decimals}. Percentages: FR "{x} %", EN "{x}%".
# Tone: naive for stages 0-1, technical 2-4, scientific 5 and above. Every adjective, cause or comparison is carried by `when`/`needs`.

# ---------------------------------------------------------------- summary
[[line]]
id = "summary.idle"
slot = "summary"
when = ["awake_ticks==0"]
needs = ["awake_ticks"]
fr = ["Je suis resté en veille pendant tout ce sol : aucun pas de temps d'éveil."]
en = ["I stayed on standby for this whole sol: no awake time steps."]

[[line]]
id = "summary.s0"
slot = "summary"
stage = [0]
needs = ["couples_sol", "distance_m"]
fr = ["J'ai envoyé {couples_sol} commandes au hasard à mes roues. Je me suis déplacé de {distance_m:0} m sans savoir pourquoi."]
en = ["I sent {couples_sol} random commands to my wheels. I moved {distance_m:0} m without knowing why."]

[[line]]
id = "summary.s1"
slot = "summary"
stage = [1]
